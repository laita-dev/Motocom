name: Build and Publish Dev Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Prepare Release Asset
        run: |
          mkdir -p build/assets
          cp app/build/outputs/apk/debug/app-debug.apk build/assets/Motocom-dev.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.21.4-dev
          name: "Motocom-dev v0.21.4"
          body: "Build automático generado desde la rama dev de Motocom."
          draft: false
          prerelease: false
          make_latest: true
          files: build/assets/Motocom-dev.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
